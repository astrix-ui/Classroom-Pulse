<div class="modal-backdrop" *ngIf="isOpen" (click)="onCancel()" role="presentation">
  <div class="modal-content" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <div class="modal-header">
      <h3 class="modal-title" [ngClass]="{'danger-title': isDanger}">{{ title }}</h3>
    </div>
    <div class="modal-body">
      <p class="modal-message">{{ message }}</p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ cancelText }}</button>
      <button type="button" class="btn" [ngClass]="isDanger ? 'btn-danger' : 'btn-primary'" (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
