<div class="join-immersive-container">
  <!-- Top Nav Bar with Theme Toggle -->
  <nav class="join-nav">
    <a routerLink="/" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>

    <button 
      type="button" 
      class="theme-toggle-btn" 
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDark ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
      [title]="themeService.isDark ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
      <svg *ngIf="themeService.isDark" class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg *ngIf="!themeService.isDark" class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </nav>

  <!-- Join Card Form -->
  <main class="join-main">
    <div class="glass-join-card">
      <div class="card-header">
        <div class="badge-row">
          <span class="student-pill">Student Portal</span>
        </div>
        <h1 class="card-title">Join Classroom</h1>
        <p class="card-subtitle">Enter the 6-digit room code provided by your teacher to connect.</p>
      </div>

      <div *ngIf="errorMessage" class="error-banner" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="joinForm" (ngSubmit)="onJoin()">
        <div class="form-group">
          <label for="roomCodeInput" class="form-label">Room Code</label>
          <div class="input-wrap">
            <input 
              id="roomCodeInput"
              type="text" 
              inputmode="numeric"
              pattern="[0-9]*"
              formControlName="roomCode" 
              class="form-input text-code"
              placeholder="e.g. 583920" 
              maxlength="6"
              autocomplete="off"
              autocapitalize="off"
              (input)="joinForm.patchValue({roomCode: roomCodeControl.value?.trim()})">
          </div>
          <div class="field-error" *ngIf="roomCodeControl.touched && roomCodeControl.errors">
            <span *ngIf="roomCodeControl.errors['required']">Room code is required.</span>
            <span *ngIf="roomCodeControl.errors['minlength'] || roomCodeControl.errors['maxlength']">
              Room code must be exactly 6 digits.
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="studentNameInput" class="form-label">Your Name</label>
          <div class="input-wrap">
            <input 
              id="studentNameInput"
              type="text" 
              formControlName="studentName" 
              class="form-input" 
              placeholder="e.g. John Smith" 
              maxlength="50"
              autocomplete="name">
          </div>
          <div class="field-error" *ngIf="studentNameControl.touched && studentNameControl.errors">
            <span *ngIf="studentNameControl.errors['required']">Your name is required.</span>
            <span *ngIf="studentNameControl.errors['minlength']">Name must be at least 2 characters.</span>
            <span *ngIf="studentNameControl.errors['maxlength']">Name cannot exceed 50 characters.</span>
          </div>
        </div>

        <div class="form-actions">
          <app-loading-spinner *ngIf="loading" message="Connecting to room..."></app-loading-spinner>
          <button 
            *ngIf="!loading" 
            type="submit" 
            class="btn btn-primary join-submit-btn" 
            [disabled]="joinForm.invalid">
            <span>Join Room</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
